[project]
name = "nurv-backend"
version = "0.1.0"
description = "Backend for Nurv"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "google-genai>=0.2.0",
    "pydantic",
    "pydantic-settings",
    "passlib[bcrypt]",
    "python-multipart",
    "python-jose[cryptography]",
    "requests",
]
